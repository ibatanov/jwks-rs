[package]
name = "jwks-rs"
version = "0.2.1"
edition = "2021"
description = "jwks client"
license = "MIT"
repository = "https://github.com/ibatanov/jwks-rs"
authors = ["Igor Batanov <irbatanov@ya.ru>"]


[dependencies]
jsonwebtoken = "11"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
httpmock = "0.8"
serde_json = "1.0.151"
